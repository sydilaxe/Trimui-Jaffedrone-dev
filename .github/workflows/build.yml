name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.11.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  mustardos:
    name: MustardOS packages (Brick / Brick Hammer, Brick Pro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version, from the release's tag
        id: version
        env:
          # a manual run's tag, a release made on the website, or a pushed v* tag; empty on other pushes
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          v="${TAG#v}"
          # it goes into the binaries as a C string and into file names: keep it plain
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+-]*$'; then
            echo "::error::tag $TAG isn't a version like v0.8.0"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building version ${v:-$(make -s version) (from src/engine.h)}"
      - name: Build
        env:
          JD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # generated files are committed; keep make from regenerating them
          touch src/font_data.h src/logo_data.h dist/Jaffedrone/splash.jdi docs/Jaffedrone-Manual.pdf
          pip install ziglang==0.14.1
          # a release's manual shows its tag's version: make it again with that version
          if [ -n "$JD_VERSION" ]; then
            pip install reportlab pillow
            make manual JD_VERSION="$JD_VERSION"
            python3 tools/mkmanual.py --check docs/Jaffedrone-Manual.pdf
          fi
          # the scripts the device runs: the launchers, the screen wake, the system report
          for s in dist/Jaffedrone/launch.sh dist/Jaffedrone/sysinfo.sh dist/mustardos/*.sh; do sh -n "$s"; done
          make package JD_VERSION="$JD_VERSION"
          v=$(make -s version JD_VERSION="$JD_VERSION")
          for d in brick brickpro; do
            file build/$d/jaffedrone | grep -q "ARM aarch64"
            # the binary carries the version (the info screen and the log show it)
            grep -qaF "$v" build/$d/jaffedrone || { echo "::error::build/$d/jaffedrone doesn't carry version $v"; exit 1; }
            # the app folder in "Jaffedrone/", with mux_launch.sh, wake_screen.sh and the glyph
            z=build/Jaffedrone-mustardos-$d.muxapp
            ls -l $z
            for f in jaffedrone mux_launch.sh wake_screen.sh sysinfo.sh launch.sh glyph/jaffedrone.svg Jaffedrone-Manual.pdf; do
              unzip -l $z | grep -q "Jaffedrone/$f$" || { echo "::error::$z has no $f"; exit 1; }
            done
            test "$(unzip -p $z Jaffedrone/DEVICE)" = $d
            unzip -p $z Jaffedrone/jaffedrone | cmp -s - build/$d/jaffedrone
            # MustardOS's Archive Manager refuses absolute and .. paths, and anything not a file or folder
            if unzip -Z1 $z | grep -Eq '^/|(^|/)\.\.(/|$)|\\'; then echo "::error::$z has unsafe paths"; exit 1; fi
            if unzip -Zl $z | grep -Eq '^[bclps]'; then echo "::error::$z has links or devices"; exit 1; fi
          done
          # the two builds differ only by the Brick Pro's sticks (a bare "! cmd" can't fail a step under set -e)
          if cmp -s build/brick/jaffedrone build/brickpro/jaffedrone; then echo "::error::the two builds are the same"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Jaffedrone-mustardos
          path: |
            build/Jaffedrone-mustardos-brick.muxapp
            build/Jaffedrone-mustardos-brickpro.muxapp

  test:
    name: Engine and UI tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test harness
        run: |
          touch src/font_data.h src/logo_data.h dist/Jaffedrone/splash.jdi
          make build/jd_test build/jd_bench
          mkdir -p build/test
          build/jd_test build/test | tee build/test/results.txt
      - name: The manual is up to date
        run: python3 tools/mkmanual.py --check docs/Jaffedrone-Manual.pdf
      - name: Check the results
        run: |
          r=build/test/results.txt
          grep -q "struck skipping: .*(want over 60: 1)" $r
          grep -q "struck cache: same sound as working the modes out every time 1" $r
          grep -q "render ahead: .* made ahead [01] (want under 2); same sound 1" $r
          # the TrimUI's four cores: voices and effects on two threads, the same sound
          grep -q "render split: two threads 1, .*same sound 1" $r
          # USB MIDI and the Brick Pro's sticks
          grep -q "midi key: A3 -> .*(want 220: 1)" $r
          grep -q "^midi voices: .*muted skipped (1): 1$" $r
          grep -q "^midi cc: .*not queued: 1$" $r
          # the MIDI chart's CC table is the one the app uses
          build/jd_test --midi-chart > cc.md
          sed -n '/<!-- cc table -->/,/<!-- end cc table -->/p' docs/MIDI.md | sed '1d;$d' | diff cc.md -
          grep -q "midi clock in: START plays 1, 120 BPM -> .* (1), STOP stops 1" $r
          grep -q "^perflog jumps: .*(want 0 1 0 0 0: 1)" $r
          grep -q "midi clock out: START 1, .*(want 192: 1), STOP 1" $r
          grep -q "^midi modes .*(want 1: 1)" $r
          # the Brick clock link (USB gadget follower, usbfs leader) and the tight clock
          grep -q "^midi clock in at 250 BPM: .*(want under 0.5: 1)" $r
          grep -q "^clock only: .*(want 1: 1)" $r
          grep -q "^link sync: .*(want 1: 1)" $r
          grep -q "^link usb: .*(want 1: 1)" $r
          grep -q "stick: .*(lighter is softer: 1); bend +2 .*(want 1.122: 1)" $r
          grep -q "^rings: .*rest dark: 1; given back (dark frame, effects on): 1$" $r
          grep -q "^level bar: full scale left 1, -21 dB two from the centre 1, shown on LEDs 1-8 1$" $r
          grep -q "stick reach: .*(want 1: 1); .*(want both 1: 1); rest 0: 1; .*(want 0, light, 1.5: 1)" $r
          grep -q "right stick: .*(want 2, 4: 1), flicker .*(want under 2: 1); .*(want 0 70 100: 1)" $r
          grep -q "stick control: .* played live as from the song 1 .*, song kept 1" $r
          grep -q "lights: found 1, .*cycles -1: 1); given back .*: 1)" $r
          grep -q "R3 on SOUND maps FOLD 1; .*(want 80: 1)" $r
          awk '/^render ahead:/ { exit !($12 + 0 >= 20) }' $r
          test "$(grep -c '^dsp WORST .*sounding 1' $r)" -eq 3
          grep -q "0 full-scale samples (want 0)" $r
          # every wind exciter in tune in every material
          test "$(grep -c '^wind .*12/12 in tune' $r)" -eq 7
          grep -q "matched the memory 8/8" $r
          grep -q "notes outside the mode 0, detuned notes 0" $r
          grep -q "presets: saved YAMAN, changed to .*, loaded back -> YAMAN" $r
          grep -q "sync: bpm=128.0 peers=1 leader=1" $r
          grep -q "^sync timing: .*(want under 1 and 2: 1)" $r
          grep -q "^sync timing, a leader without echo: .*(want under 6: 1)" $r
          grep -q "ombak 4 Hz: L/R flips 0 (want 0), swells 4.0 per s" $r
          grep -q "balinese tunings: 3/3 profiles in place" $r
          grep -q "save compat v0.7: load=1 scale=SEDANG voice5=FLUTE release=55 playmode=0 bpm=66" $r
          # a voice change fades the old voice out rather than cutting it
          awk '/^voice switch:/ { exit !($3 + 0 > 75) }' $r
          grep -q "^voice switch:" $r
          grep -q "latch release 12 s: .*: 1)" $r
          grep -q "save compat v0.8: load=1 scale=TIRUS playmode=1 release=80 attack=68" $r
          grep -q "save compat v0.11: load=1 attack=42 s ring=77 air=0 listening=0" $r
          grep -q "save compat v0.12: load=1 bpm=70 playmode=1 air=33 output=0" $r
          grep -q "clock out: 2 PPQN at 120 BPM on the right -> 16 pulses in 4 s, mean gap 250.00 ms, width 5.00 ms, other values 0" $r
          grep -q "clock out: 24 PPQN at 120 BPM on the right -> 192 pulses in 4 s, mean gap 20.83 ms, width 5.00 ms, other values 0" $r
          grep -q "clock out: 2 PPQN at 120 BPM on the left -> 16 pulses .* other values 0" $r
          grep -q "clock out stopped: pulses 0 (want 0)" $r
          grep -q "air in latch: .*(want them singing: 1), a listener refuses the latch 1" $r
          grep -q "latch attack: .*: 1)" $r
          grep -q "latch harmonic: .*(x2.0" $r
          grep -q "buttons: L1 -> PLUCK, L2 -> STRIKE" $r
          grep -q "mallet drop: .*(want 3 or more: 1); .*(want a flutter: 1)" $r
          grep -q "strike: .*brighter: 1)" $r
          grep -q "both shoulders: LATCH R1 then L1 .*(x2.00), let go .*, still droning 1; L1 then R1 x2.00; RINGS R1 then L1 .*(x2.00)" $r
          grep -q "struck checks: tune 1, drum shorter 1, bowl sings 1, cymbal sings 1, hard brighter 1, touch higher 1" $r
          grep -q "family jump: LIP -> GENDER -> STRING" $r
          grep -q "metal drone: RING DRONE, .*(want over 70%: 1); beyond: 3/3 sound" $r
          grep -q "struck limiter: .*(want it levelled off: 1)" $r
          grep -q "latch checks: silent 1, starts 1, drones 1, fades 1, bow swells 1, wind drones 1 and fades 1" $r
          # strings and winds side by side; a v0.5 WIND song loads as winds
          grep -q "v0.5 WIND song load 1 voices DOUBLE DOUBLE body 6 (want GLASS 6)" $r
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test/

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [mustardos, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the packages carry the tag's version (the mustardos job builds with it)
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Jaffedrone-mustardos
      - name: Create GitHub release with the MustardOS packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          files="Jaffedrone-mustardos-brick.muxapp Jaffedrone-mustardos-brickpro.muxapp"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $files \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Jaffedrone $TAG (test build)" \
              --notes-file .github/release-notes.md \
              --prerelease
          fi
